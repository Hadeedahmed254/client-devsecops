# Production Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bankdb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==============================
# God-Level Metrics Configuration 🚀
# ==============================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# ==============================
# ⚑ Feature Flags — Unleash 🚀
# ==============================
# URL to the Unleash server running in the cluster (unleash namespace)
# Injected from AWS Secrets Manager via External Secrets Operator in K8s
unleash.server.url=${UNLEASH_SERVER_URL:http://unleash-service.unleash.svc.cluster.local:4242/api}
# API key for Unleash client authentication
unleash.api.key=${UNLEASH_API_KEY:default:development.unleash-insecure-api-token}
spring.application.name=bankapp
